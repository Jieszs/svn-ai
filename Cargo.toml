[workspace]
members = [
    "crates/svn-ai-core",
    "crates/svn-ai-protocol",
    "crates/svn-ai-svn",
    "crates/svn-ai-validate",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "Apache-2.0"
repository = "https://github.com/Jieszs/svn-ai"

[workspace.dependencies]
blake3 = "1.8"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
imara-diff = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v7"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1
